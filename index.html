#projectPage{max-width:1440px;padding:24px 48px 40px}

#projectPage .local-search input{font-size:12px}

#projectPage .chip[aria-pressed="true"]{color:#171717;background:#e9e9e9}
#projectPage .list-toolbar{gap:12px;margin-bottom:16px}
#projectPage .list-assignee-filter{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;font-size:12px;color:var(--ink)}
#listAssignee{width:150px;min-width:0;max-width:100%;padding-right:28px;text-overflow:ellipsis}
#projectPage .title-row{flex-wrap:nowrap}
#projectPageTitle{flex:0 1 auto;max-width:100%;overflow:hidden}
#projectSwitcher{display:flex;align-items:center;gap:8px;max-width:100%;padding:0;border:0;border-radius:4px;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-align:left}
#projectSwitcher:hover{background:var(--hover)}
#projectPageName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#projectSwitcher svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
#projectPage .back-action{flex-shrink:0}
#projectPage .project-page-panel .sectionhead{margin-bottom:24px}
#projectPage .tablewrap{border:1px solid #e7e7e7;border-radius:12px;background:#fff}
#projectPage th{font-size:11px;padding:12px 16px;background:#f2f2f2;color:#666}
#projectPage td{font-size:12px;padding:16px;color:#292929}
#projectPage .reqtitle{font-size:13px;line-height:1.5;color:#292929}
#projectPage .req-id,#projectPage .inline-hint{font-size:10px;color:#666}
#projectPage .inline-editor{height:36px;font-size:12px;border-radius:8px}
#projectPage .tag,#requirementPage #requirementSubtitle .tag{font-size:11px}
#requirementPage .pane-toolbar .pane-heading{font-size:14px;line-height:1.5}
#requirementPage .pane-toolbar .icon-action{min-height:36px;padding:7px 8px;font-size:12px;border-radius:8px}
#requirementPage .pane-toolbar .view-switch .icon-action{min-height:30px;min-width:30px;padding:5px;border-radius:6px}
#requirementPage .mobile-pane-tabs button{min-height:36px;font-size:12px}
#projectPage .empty-state p,#requirementPage .prototype-empty p,#requirementPage .detail-empty p{font-size:12px;color:#666}
#projectPage button:focus-visible,#requirementPage button:focus-visible{outline:2px solid #202020;outline-offset:3px}
@media(max-width:1150px){#projectPage{padding-right:28px;padding-left:28px}}

@media(prefers-reduced-motion:reduce){#projectPage *,#projectPage *::before,#projectPage *::after,#requirementPage *,#requirementPage *::before,#requirementPage *::after{animation:none!important;transition:none!important}}

n-action" id="expandPrd" type="button" title="展开需求说明" aria-label="展开需求说明" aria-expanded="false" aria-controls="requirementPrd" hidden><svg aria-hidden="true"><use href="#chevron-down"/></svg><span class="vertical-label">展开需求说明</span></button><div class="view-switch" id="prdViewSwitch" role="group" aria-label="切换需求说明预览与代码" hidden><button class="icon-action" id="prdPreviewTab" type="button" title="查看需求说明预览" aria-label="查看需求说明预览" aria-pressed="true" aria-controls="prdPreviewContent"><svg aria-hidden="true"><use href="#eye"/></svg></button><button class="icon-action" id="prdCodeTab" type="button" title="查看需求说明代码" aria-label="查看需求说明代码" aria-pressed="false" aria-controls="prdCodeContent"><svg aria-hidden="true"><use href="#code"/></svg></button></div><button class="icon-action" id="uploadPrd" type="button" title="上传需求说明" aria-label="上传需求说明"><svg aria-hidden="true"><use href="#upload"/></svg><span class="action-label">上传</span></button></div></div><div id="requirementPrd"></div></section></div></main>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const esc=text=>String(text==null?'':text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS=['待开始','进行中','已完成'];
const VIRTUAL_ASSIGNEES=[];
const virtualAssignee=name=>String(name||'').trim();
function assigneeNames(){return [...new Set([...VIRTUAL_ASSIGNEES,...requirements.map(requirement=>requirement.assignee).filter(Boolean)])]}
function moduleNames(project){return [...new Set([...(project.modules||[]),...requirements.filter(r=>r.project===project.id).map(r=>r.module).filter(Boolean)])]}
const SPLIT_KEY='requirements-workspace-split-v1';
const LIST_KEY='requirements-workspace-list-v1';
const MAX_CONTENT=2*1024*1024;
const pad=n=>String(n).padStart(2,'0');
const nowISO=()=>new Date().toISOString();
const reqCode=r=>'REQ-'+String(r.id).padStart(3,'0');
const bytes=text=>new Blob([String(text==null?'':text)]).size;
const toISO=(value,fallback)=>{const d=new Date(value);return isNaN(d.getTime())?fallback:new Date(d.getTime()).toISOString()};
const toMs=value=>{if(typeof value==='number'&&isFinite(value))return value;const d=new Date(value);return isNaN(d.getTime())?0:d.getTime()};
const safeName=name=>String(name||'未命名').replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').replace(/\s+/g,' ').trim().slice(0,60)||'未命名';
const fileStamp=()=>{const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`};
function fmtDate(value){const d=new Date(value);return isNaN(d.getTime())?'—':`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fmtDateTime(value){const d=new Date(value);if(isNaN(d.getTime()))return '—';return `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtRelative(value){const d=new Date(value);if(isNaN(d.getTime()))return '—';const diff=Date.now()-d.getTime();if(diff<60000)return '刚刚';if(diff<3600000)return `${Math.floor(diff/60000)} 分钟前`;if(diff<86400000)return `${Math.floor(diff/3600000)} 小时前`;if(diff<7*86400000)return `${Math.floor(diff/86400000)} 天前`;return fmtDate(d)}

let projects=[],requirements=[];
let activeRequirementId=null,activeProjectId=null,currentPage='workspace';
let lastFocus=null,toastTimer=null,modalGuard=null;
let homeScroll=0,searchReturn=null,searchCache=[],searchIndex=-1,searchQuery='',pendingScrollRestore=false;
let listState={projectId:null,status:'all',query:'',assignee:'all',lastRequirementId:null,scrollY:0};
try{const stored=JSON.parse(sessionStorage.getItem(LIST_KEY));if(stored&&typeof stored==='object')listState={...listState,...stored}}catch{}


let revision=0,ready=false,saving=false,uploading=false,conflicted=false,workspaceDirty=false,modalDirty=false,lastHash=location.hash||'#/';
const apiBanner=document.createElement('section');
apiBanner.id='apiBanner';
apiBanner.style.cssText='position:sticky;top:0;z-index:100;background:#fff5d9;padding:12px 24px;border-bottom:1px solid #dcc;display:flex;gap:12px;align-items:center;flex-wrap:wrap';
document.body.prepend(apiBanner);
function banner(message,actions=[]){
apiBanner.style.display=message==='已连接服务器'?'none':'flex';
apiBanner.replaceChildren();
const text=document.createElement('span');text.setAttribute('role','status');text.textContent=message;apiBanner.append(text);
for(const [label,handler] of actions){const button=document.createElement('button');button.className='secondary';button.textContent=label;button.onclick=handler;apiBanner.append(button)}
}
function exportDraft(){
const form=$('dialog').querySelector('form');
const inputs=form?[...form.querySelectorAll('input,textarea,select')].filter(el=>el.type!=='file').map(el=>({id:el.id,name:el.name,value:el.value,checked:el.checked})):[];
download(JSON.stringify({revision,projects,requirements,unsavedInputs:inputs},null,2),`工作台草稿-${fileStamp()}.json`,'application/json');
}
function failure(message){banner(message,[['导出当前草稿',exportDraft],...(!conflicted?[['重试保存',async()=>{if(modalDirty){showToast('请在当前表单中点击保存，草稿仍保留');return}if(await save())refreshCurrent()}]]:[]),['重新加载服务器版本',async()=>{if(saving)return;if(!confirm('重新加载将丢弃全部未保存修改和当前输入，无法恢复。确定继续？'))return;await load()}]]);}
function refreshCurrent(){if(currentPage==='project')renderProjectPage();else if(currentPage==='requirement')renderRequirementPage();else renderWorkspace()}
async function load(){
if(saving||uploading)return;
ready=false;document.querySelectorAll('main').forEach(el=>el.hidden=true);
banner('正在加载服务器工作台…');
try{
const response=await fetch('/api/workspace',{cache:'no-store'});
if(!response.ok)throw new Error(`加载失败（HTTP ${response.status}）`);
const data=await response.json();
if(!Array.isArray(data.projects)||!Array.isArray(data.requirements)||!Number.isSafeInteger(data.revision))throw new Error('服务器工作台格式无效');
projects=data.projects;requirements=data.requirements;revision=data.revision;
conflicted=false;workspaceDirty=false;modalDirty=false;ready=true;
closeModal(true);banner('已连接服务器');route();
}catch(error){banner(error.message,[['重试加载',load],...(workspaceDirty||modalDirty?[['导出草稿',exportDraft]]:[])])}
}
function persistList(){try{sessionStorage.setItem(LIST_KEY,JSON.stringify(listState))}catch{}}
async function save(){
workspaceDirty=true;
if(!ready||saving||conflicted){if(conflicted)failure('版本冲突：草稿保留。请导出草稿，或明确丢弃后加载最新版本；不会覆盖他人修改。');return false}
saving=true;
const controls=[...document.querySelectorAll('button,input,textarea,select')].map(el=>[el,el.disabled]);
controls.forEach(([el])=>el.disabled=true);
banner('正在保存到服务器…');
try{
const response=await fetch('/api/workspace',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({projects,requirements,revision})});
const data=await response.json().catch(()=>({}));
if(response.status===409){conflicted=true;throw new Error('版本冲突：输入与草稿已保留。请导出草稿，或丢弃修改并加载最新版本。')}
if(!response.ok)throw new Error(data.error||`保存失败（HTTP ${response.status}）`);
if(!Number.isSafeInteger(data.revision)||!Array.isArray(data.projects)||!Array.isArray(data.requirements))throw new Error('保存响应格式无效，请核对服务器版本后重试');
projects=data.projects;requirements=data.requirements;revision=data.revision;workspaceDirty=false;
banner('已保存到服务器 · '+fmtDateTime(nowISO()));return true;
}catch(error){failure(error.message+'；未报告保存成功。');return false}
finally{saving=false;controls.forEach(([el,disabled])=>{if(el.isConnected)el.disabled=disabled})}
}
function bumpProject(projectId,iso){const project=projects.find(p=>p.id===projectId);if(project)project.updatedAt=iso}

function tag(status){return `<span class="tag ${status==='已完成'?'complete':status==='进行中'?'progressing':''}">${esc(status)}</span>`}
function projectStats(id){const list=requirements.filter(r=>r.project===id),done=list.filter(r=>r.status==='已完成').length;return {total:list.length,done,percent:list.length?Math.round(done/list.length*100):0}}
function setPage(name){currentPage=name;$('workspacePage').hidden=name!=='workspace';$('projectPage').hidden=name!=='project';$('requirementPage').hidden=name!=='requirement'}

let projectFilter='all';
function projectStatus(project){const stats=projectStats(project.id);return stats.total&&stats.done===stats.total?'done':'active'}
function todayPending(){const today=new Date();today.setHours(0,0,0,0);return requirements.filter(r=>r.status==='待开始'&&toMs(r.createdAt)>=today.getTime()&&toMs(r.createdAt)<=Date.now()).sort((a,b)=>toMs(b.createdAt)-toMs(a.createdAt))}
function renderWorkspace(){
const week=new Date();week.setHours(0,0,0,0);week.setDate(week.getDate()-((week.getDay()+6)%7));
$('statProjects').textContent=projects.length;
$('statActive').textContent=requirements.filter(r=>r.status==='进行中').length;
$('statDone').textContent=requirements.filter(r=>r.status==='已完成').length;
$('statWeek').textContent=requirements.filter(r=>toMs(r.updatedAt)>=week.getTime()&&toMs(r.updatedAt)<=Date.now()).length;
$('statWeek').parentElement.title='本周一至今更新的需求数（含新建）';
const sorted=[...projects].filter(p=>projectFilter==='all'||projectStatus(p)===projectFilter).sort((a,b)=>toMs(b.updatedAt)-toMs(a.updatedAt));
$('projectCount').textContent=sorted.length;
document.querySelectorAll('[data-project-filter]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.projectFilter===projectFilter)));
$('projects').innerHTML=(sorted.length?sorted.map(projectCard).join(''):`<div class="empty-state"><h3>${projects.length?'暂无匹配项目':'还没有项目'}</h3><p>可切换筛选，或创建新项目开始协作。</p></div>`)+`<button class="project new-project" type="button" data-action="add-project">${icon('plus')}<span>新建项目</span><small>开启下一段协作</small></button>`;
const pending=todayPending();
$('pendingCount').textContent=pending.length?`今日新增 ${pending.length} 条待处理需求`:'今日暂无新增待处理需求';
renderRecent();
}
function projectCard(project){
const stats=projectStats(project.id),status=projectStatus(project);
return `<button class="project" type="button" data-project="${project.id}" aria-label="查看${esc(project.name)}项目"><div class="cardtop"><span class="folder">${icon('folder')}</span><h3>${esc(project.name)}</h3><span class="project-status" data-state="${status==='done'?'done':stats.total?'active':'pending'}">${status==='done'?'已完成':stats.total?'进行中':'待开始'}</span></div><p class="projectdesc">${esc(project.description||'暂无项目描述')}</p><div class="projectstats"><span>需求<b>${stats.total}</b></span><span>已完成<b>${stats.done}</b></span></div><div><div class="progresslabel"><span>需求完成率</span><span>${stats.percent}%</span></div><div class="progress" role="progressbar" aria-label="需求完成率" aria-valuenow="${stats.percent}" aria-valuemin="0" aria-valuemax="100"><span style="width:${stats.percent}%"></span></div></div><div class="cardfoot"><span>更新于 ${esc(fmtRelative(project.updatedAt))}</span><span>进入 →</span></div></button>`;
}
function renderRecent(){
const recent=requirements.filter(r=>r.viewed).sort((a,b)=>toMs(b.viewed)-toMs(a.viewed));
$('recentRows').innerHTML=recent.slice(0,5).map(r=>`<button class="recent-item" type="button" data-req="${r.id}"><span class="recent-name">${esc(r.title)}</span><span class="recent-project">${esc((projects.find(p=>p.id===r.project)||{}).name||'')} · ${esc(fmtRelative(r.viewed))}</span></button>`).join('')||'<div class="empty">暂无浏览记录，搜索或进入项目查看需求。</div>';
}

function filterProjectRequirements(projectId){
let list=requirements.filter(r=>r.project===projectId);
if(listState.status!=='all')list=list.filter(r=>r.status===listState.status);
if(listState.assignee!=='all')list=list.filter(r=>listState.assignee===''?!r.assignee:'person:'+r.assignee===listState.assignee);
const query=listState.query.trim().toLowerCase();
if(query){
const idQuery=query.replace(/^req[-_\s]?/,'');
const asId=/^\d+$/.test(idQuery)?Number(idQuery):null;
list=list.filter(r=>{
if(asId!==null&&r.id===asId)return true;
if(reqCode(r).toLowerCase().includes(query))return true;
return [r.title,r.summary,r.assignee,r.status].join(' ').toLowerCase().includes(query);
});
}
list.sort((a,b)=>toMs(b.createdAt)-toMs(a.createdAt));
return list;
}
function renderProjectPage(){
const project=projects.find(p=>p.id===listState.projectId);
if(!project)return;
$('projectCrumb').textContent=project.name;
$('projectPageName').textContent=project.name;
$('projectSwitcher').title=project.name;
const stats=projectStats(project.id);
$('projectPageSummary').textContent=`${project.description||'项目需求列表'} · ${stats.total} 条需求，${stats.done} 条已完成`;
if(document.activeElement!==$('listSearch'))$('listSearch').value=listState.query;
document.querySelectorAll('.chip[data-status]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.status===listState.status)));
const filterNames=[...new Set(requirements.filter(r=>r.project===project.id).map(r=>r.assignee).filter(Boolean))];
if(listState.assignee.startsWith('person:')&&!filterNames.includes(listState.assignee.slice(7)))filterNames.push(listState.assignee.slice(7));
$('listAssignee').innerHTML='<option value="all">全部人员</option><option value="">未指派</option>'+filterNames.map(name=>`<option value="${esc('person:'+name)}">${esc(name)}</option>`).join('');
$('listAssignee').value=listState.assignee;
const list=filterProjectRequirements(project.id);
const ASSIGNEES=assigneeNames();
const MODULES=moduleNames(project);
 $('projectRequirementRows').innerHTML=list.map(r=>`<tr data-row-req="${r.id}" class="${r.id===listState.lastRequirementId?'is-recent':''}"><td><button class="reqtitle" type="button" data-req="${r.id}">${icon('file')}<span><span class="req-id">${esc(reqCode(r))}</span>${esc(r.title)}</span></button></td><td data-label="模块"><select class="inline-editor module-editor" data-inline-field="module" data-req-id="${r.id}" aria-label="${esc(r.title)}模块"><option value="">未设置</option>${MODULES.map(name=>`<option value="${esc(name)}"${r.module===name?' selected':''}>${esc(name)}</option>`).join('')}</select></td><td data-label="指派给"><select class="inline-editor assignee-editor" data-inline-field="assignee" data-req-id="${r.id}" aria-label="${esc(r.title)}指派给"><option value="">未指派</option>${ASSIGNEES.map(name=>`<option value="${esc(name)}"${r.assignee===name?' selected':''}>${esc(name)}</option>`).join('')}</select></td><td data-label="状态"><select class="inline-editor status-editor" data-inline-field="status" data-req-id="${r.id}" data-value="${esc(r.status)}" aria-label="${esc(r.title)}状态">${STATUS.map(status=>`<option value="${esc(status)}"${r.status===status?' selected':''}>${esc(status)}</option>`).join('')}</select></td><td data-label="更新于" title="${esc(fmtDateTime(r.updatedAt))}"><span data-updated-req="${r.id}">${esc(fmtRelative(r.updatedAt))}</span></td></tr>`).join('');
const isEmpty=list.length===0;
$('projectEmpty').hidden=!isEmpty;
if(isEmpty){
const filtered=requirements.some(r=>r.project===project.id);
$('projectEmpty').innerHTML=filtered
?`<h3>没有匹配的需求</h3><p>当前筛选条件「${esc([listState.query,listState.status!=='all'?listState.status:'',listState.assignee==='all'?'':listState.assignee===''?'未指派':listState.assignee.slice(7)].filter(Boolean).join(' · '))}」下没有结果，试试清除筛选。</p><div class="empty-actions"><button type="button" class="secondary" data-action="clear-filter">清除筛选</button></div>`
:`<h3>这个项目还没有需求</h3><p>新建需求后，可继续上传原型与需求说明。</p><div class="empty-actions"><button type="button" class="primary" data-action="add-requirement">${icon('plus')}新增需求</button></div>`;
}
document.querySelector('#projectPage .tablewrap').hidden=isEmpty;
}

function contentPreview(content,title){
if(!content)return '';
if(content.packageId)return `<iframe class="content-preview" title="${esc(title)}" sandbox="allow-scripts" referrerpolicy="no-referrer" src="${esc(packageUrl(content.entryUrl))}"></iframe>`;
if(content.format==='html')return `<iframe class="content-preview" title="${esc(title)}" sandbox="${title==='原型预览'?'allow-scripts':''}" referrerpolicy="no-referrer" srcdoc="${esc(content.text)}"></iframe>`;
return `<article class="markdown-preview">${markdownHtml(content.text)}</article>`;
}
function setPrototypeView(code){
const preview=$('prototypePreviewContent'),codeEl=$('prototypeCodeContent');
if(preview)preview.hidden=code;
if(codeEl)codeEl.hidden=!code;
$('prototypePreviewTab').setAttribute('aria-pressed',String(!code));
$('prototypeCodeTab').setAttribute('aria-pressed',String(code));
}
function setPrdView(code){
const preview=$('prdPreviewContent'),codeEl=$('prdCodeContent');
if(!preview||!codeEl)return;
preview.hidden=code;
codeEl.hidden=!code;
$('prdPreviewTab').setAttribute('aria-pressed',String(!code));
$('prdCodeTab').setAttribute('aria-pressed',String(code));
}
function renderRequirementPage(){
const requirement=requirements.find(r=>r.id===activeRequirementId);
if(!requirement)return;
const project=projects.find(p=>p.id===requirement.project);
$('requirementPageTitle').textContent=requirement.title;
$('requirementProjectCrumb').textContent=project?project.name:'项目';
$('requirementProjectCrumb').onclick=()=>nav('#/project/'+requirement.project);
const assigneeName=requirement.assignee||'未指派';

function markdownHtml(source){
const lines=String(source==null?'':source).replace(/\r\n?/g,'\n').split('\n');
const out=[];
const headingOf=line=>{
const match=line.match(/^\s{0,3}(#{1,6})\s*(.*)$/);
if(!match)return null;
return {level:match[1].length,text:match[2].replace(/\s+#+\s*$/,'').trim()};
};
const fenceOf=line=>{
const match=line.match(/^\s{0,3}(`{3,}|~{3,})(.*)$/);
if(!match)return null;
return {marker:match[1].charAt(0),length:match[1].length,info:match[2].trim()};
};
const isHr=line=>/^\s{0,3}(?:(?:\*\s*){3,}|(?:-\s*){3,}|(?:_\s*){3,})$/.test(line);
const isQuote=line=>/^\s{0,3}>/.test(line);
const isList=line=>/^\s*(?:[-*+]|\d+[.)])\s+/.test(line);
const isSeparator=line=>/^\s*\|?\s*:?-{2,}:?\s*(?:\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(line);
const isTableRow=line=>line.indexOf('|')>-1&&line.trim().length>0;
const splitRow=line=>line.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(cell=>cell.trim());
const tableStart=position=>isTableRow(lines[position])&&position+1<lines.length&&isSeparator(lines[position+1]);
const startsBlock=position=>{
const line=lines[position];
return !line.trim()||!!fenceOf(line)||!!headingOf(line)||isHr(line)||isQuote(line)||isList(line)||tableStart(position);
};
const renderList=(start,first)=>{
const baseIndent=first[1].length;
const ordered=/^\d/.test(first[2]);
const startNumber=ordered?parseInt(first[2],10)||1:1;
const items=[];
let position=start;
while(position<lines.length){
const item=lines[position].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
if(!item){
if(!lines[position].trim()){
const next=position+1<lines.length?lines[position+1].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/):null;
if(next&&next[1].length>=baseIndent){position++;continue}
}
break;
}
const indent=item[1].length;
if(indent<baseIndent)break;
if(indent>baseIndent){
const nested=renderList(position,item);
if(items.length)items[items.length-1].children.push(nested.html);
position=nested.index;
continue;
}
if(/^\d/.test(item[2])!==ordered)break;
let text=item[3];
let task=null;
const taskMatch=text.match(/^\[([ xX])\]\s+(.*)$/);
if(taskMatch){task=taskMatch[1].toLowerCase()==='x';text=taskMatch[2]}
position++;
const extra=[];
while(position<lines.length&&lines[position].trim()&&!/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[position])){
const contIndent=(lines[position].match(/^\s*/)||[''])[0].length;
if(contIndent<=Math.max(baseIndent,indent))break;
extra.push(lines[position].trim());
position++;
}
items.push({text:extra.length?text+' '+extra.join(' '):text,task,children:[]});
}
const tag=ordered?'ol':'ul';
const startAttr=ordered&&startNumber!==1?` start="${startNumber}"`:'';
const html=`<${tag}${startAttr}>${items.map(entry=>{
const box=entry.task===null?'':`<input type="checkbox" disabled${entry.task?' checked':''}> `;
return `<li${entry.task===null?'':' class="task-item"'}>${box}${inlineMarkdown(entry.text)}${entry.children.join('')}</li>`;
}).join('')}</${tag}>`;
return {html,index:position};
};
let index=0;
while(index<lines.length){
const line=lines[index];
const fence=fenceOf(line);
if(fence){
const buffer=[];
index++;
while(index<lines.length){
const closing=fenceOf(lines[index]);
if(closing&&closing.marker===fence.marker&&closing.length>=fence.length&&!closing.info){index++;break}
buffer.push(lines[index]);
index++;
}
const language=/^[\w+#.\-]{1,32}$/.test(fence.info)?fence.info:'';
out.push(`<pre><code${language?` class="language-${esc(language)}"`:''}>${esc(buffer.join('\n'))}</code></pre>`);
continue;
}
if(!line.trim()){index++;continue}
const heading=headingOf(line);
if(heading){out.push(`<h${heading.level}>${inlineMarkdown(heading.text)}</h${heading.level}>`);index++;continue}
if(isHr(line)){out.push('<hr>');index++;continue}
if(tableStart(index)){
const head=splitRow(line);
const align=splitRow(lines[index+1]).map(cell=>{const left=cell.startsWith(':'),right=cell.endsWith(':');return left&&right?'center':right?'right':left?'left':''});
index+=2;
const rows=[];
while(index<lines.length&&isTableRow(lines[index])){rows.push(splitRow(lines[index]));index++}
out.push(`<div class="table-scroll"><table><thead><tr>${head.map((cell,cellIndex)=>`<th${align[cellIndex]?` style="text-align:${align[cellIndex]}"`:''}>${inlineMarkdown(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${head.map((cell,cellIndex)=>`<td${align[cellIndex]?` style="text-align:${align[cellIndex]}"`:''}>${inlineMarkdown(row[cellIndex]==null?'':row[cellIndex])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
continue;
}
if(isQuote(line)){
const buffer=[];
while(index<lines.length&&isQuote(lines[index])){buffer.push(lines[index].replace(/^\s{0,3}>\s?/,''));index++}
out.push(`<blockquote>${markdownHtml(buffer.join('\n'))}</blockquote>`);
continue;
}
const listItem=line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
if(listItem){
const rendered=renderList(index,listItem);
out.push(rendered.html);
index=rendered.index;
continue;
}
const buffer=[];
while(index<lines.length&&!startsBlock(index)){buffer.push(lines[index].trim());index++}
if(!buffer.length){index++;continue}
out.push(`<p>${buffer.map(inlineMarkdown).join('<br>')}</p>`);
}
return out.join('');
}
function safeUrl(raw,allowDataImage){
const url=String(raw==null?'':raw).trim();
if(!url)return '';
if(/[\u0000-\u0020\u007f]/.test(url))return '';
const compact=url.replace(/[\u0000-\u0020\u007f]+/g,'');
if(allowDataImage&&/^data:image\/(?:png|jpe?g|gif|webp|avif|bmp);base64,[a-z0-9+/=]+$/i.test(compact))return url;
if(/^(?:javascript|vbscript|data|file|blob):/i.test(compact))return '';
if(/^(?:https?:|mailto:|\/|#|\?|\.{1,2}\/)/i.test(compact))return url;
if(!/^[a-z][a-z0-9+.\-]*:/i.test(compact))return url;
return '';
}
function inlineMarkdown(raw){
const store=[];
const keep=html=>{store.push(html);return `\u0000${store.length-1}\u0000`};
let text=String(raw==null?'':raw);
text=text.replace(/`([^`\n]+)`/g,(match,code)=>keep(`<code>${esc(code)}</code>`));
text=text.replace(/!\[([^\]]*)\]\(\s*<?([^)\s>]+)>?(?:\s+["'][^"']*["'])?\s*\)/g,(match,alt,url)=>{
const safe=safeUrl(url,true);
if(!safe)return keep(esc(match));
return keep(`<img src="${esc(safe)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer">`);
});
text=text.replace(/\[([^\]]+)\]\(\s*<?([^)\s>]+)>?(?:\s+["'][^"']*["'])?\s*\)/g,(match,label,url)=>{
const safe=safeUrl(url,false);
if(!safe)return keep(esc(match));
const external=/^(?:https?:|mailto:)/i.test(safe);
return keep(`<a href="${esc(safe)}"${external?' target="_blank" rel="noopener noreferrer"':''}>${esc(label)}</a>`);
});
text=esc(text);
text=text.replace(/\*\*([\s\S]+?)\*\*/g,'<strong>$1</strong>');
text=text.replace(/(^|[^\w])__([\s\S]+?)__(?!\w)/g,'$1<strong>$2</strong>');
text=text.replace(/~~([\s\S]+?)~~/g,'<del>$1</del>');
text=text.replace(/(^|[^*])\*(?!\*)([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
text=text.replace(/(^|[^\w])_(?!_)([^_\n]+?)_(?!\w)/g,'$1<em>$2</em>');
return text.replace(/\u0000(\d+)\u0000/g,(match,slot)=>store[Number(slot)]||'');
}

const tooltipEl=document.createElement('div');
tooltipEl.id='uiTooltip';
tooltipEl.className='ui-tooltip';
tooltipEl.setAttribute('role','tooltip');
document.body.appendChild(tooltipEl);
let tooltipAnchor=null,restoreDescribedBy=null;
const tipText=el=>String(el.dataset.tip||'').trim();
const tipTargetFrom=node=>node instanceof Element?node.closest('[data-tip]'):null;
function hideTip(){
if(!tooltipAnchor&&!tooltipEl.classList.contains('is-visible'))return;
tooltipEl.classList.remove('is-visible');
if(tooltipAnchor){
if(restoreDescribedBy&&restoreDescribedBy.el===tooltipAnchor)tooltipAnchor.setAttribute('aria-describedby',restoreDescribedBy.value);
else tooltipAnchor.removeAttribute('aria-describedby');
}
tooltipAnchor=null;
restoreDescribedBy=null;
}
function placeTip(anchor){
const gap=8,pad=8;
tooltipEl.style.top='0px';
tooltipEl.style.left='0px';
const rect=anchor.getBoundingClientRect();
const width=tooltipEl.offsetWidth,height=tooltipEl.offsetHeight;
let top=rect.top-height-gap;
if(top<pad){
const below=rect.bottom+gap;
top=below+height+pad<=window.innerHeight?below:Math.max(pad,window.innerHeight-height-pad);
}
top=Math.max(pad,Math.min(top,window.innerHeight-height-pad));
let left=rect.left+rect.width/2-width/2;
left=Math.max(pad,Math.min(left,window.innerWidth-width-pad));
tooltipEl.style.left=Math.round(left)+'px';
tooltipEl.style.top=Math.round(top)+'px';
}
function showTip(anchor){
if(!anchor||anchor===tooltipEl||!anchor.isConnected)return;
const text=tipText(anchor);
if(!text){hideTip();return}
if(tooltipAnchor===anchor&&tooltipEl.classList.contains('is-visible')){placeTip(anchor);return}
if(tooltipAnchor&&tooltipAnchor!==anchor)hideTip();
tooltipAnchor=anchor;
tooltipEl.textContent=text;
tooltipEl.classList.add('is-visible');
placeTip(anchor);
const previous=anchor.getAttribute('aria-describedby');
restoreDescribedBy=previous?{el:anchor,value:previous}:null;
anchor.setAttribute('aria-describedby',previous?previous+' uiTooltip':'uiTooltip');
}
function syncTipTarget(el){
if(el&&['expandPrd','collapsePrd','uploadPrototype','uploadPrd','fullscreenPrototype'].includes(el.id)){
el.removeAttribute('title');
el.removeAttribute('data-tip');
if(el===tooltipAnchor)hideTip();
return;
}
if(!el||el.nodeType!==1||el===tooltipEl||el.tagName==='IFRAME'||!el.hasAttribute('title'))return;
const text=String(el.getAttribute('title')||'').trim();
el.removeAttribute('title');
if(!text){
if(el.hasAttribute('data-tip'))el.removeAttribute('data-tip');
if(el===tooltipAnchor)hideTip();
return;
}
el.setAttribute('data-tip',text);
if(el===tooltipAnchor){tooltipEl.textContent=text;placeTip(el)}
}
function scanTipTitles(root){
if(!root||root.nodeType!==1)return;
if(root.hasAttribute('title'))syncTipTarget(root);
const nodes=root.querySelectorAll('[title]');
for(let index=0;index<nodes.length;index+=1)syncTipTarget(nodes[index]);
}
function tipAtPoint(x,y){
const nodes=document.querySelectorAll('[data-tip][disabled]');
for(let index=0;index<nodes.length;index+=1){
const el=nodes[index];
if(!el.getClientRects().length)continue;
const rect=el.getBoundingClientRect();
if(x>=rect.left&&x<=rect.right&&y>=rect.top&&y<=rect.bottom)return el;
}
return null;
}
const tipObserver=new MutationObserver(records=>{
records.forEach(record=>{
if(record.type==='attributes'){syncTipTarget(record.target);return}
record.addedNodes.forEach(node=>{if(node.nodeType===1)scanTipTitles(node)});
if(tooltipAnchor&&!tooltipAnchor.isConnected)hideTip();

});
tipObserver.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['title']});
scanTipTitles(document.body);
document.addEventListener('pointerover',event=>{
if(event.pointerType==='touch')return;
const target=tipTargetFrom(event.target);
if(target){showTip(target);return}
if(event.target instanceof Element&&event.target.closest('#uiTooltip'))return;
hideTip();
});
document.addEventListener('pointermove',event=>{
if(event.pointerType==='touch')return;
if(tipTargetFrom(event.target))return;
const hit=tipAtPoint(event.clientX,event.clientY);
if(hit){showTip(hit);return}
if(tooltipAnchor&&tooltipAnchor.disabled)hideTip();
},{passive:true});
document.addEventListener('pointerout',event=>{if(!event.relatedTarget)hideTip()});
document.addEventListener('focusin',event=>{
const target=tipTargetFrom(event.target);
if(target)showTip(target);
});
document.addEventListener('focusout',event=>{
if(tooltipAnchor&&event.target instanceof Element&&(event.target===tooltipAnchor||tooltipAnchor.contains(event.target)))hideTip();
});
document.addEventListener('click',hideTip,true);
document.addEventListener('keydown',event=>{if(event.key==='Escape')hideTip()});
window.addEventListener('scroll',hideTip,{capture:true,passive:true});
window.addEventListener('resize',hideTip);
window.addEventListener('blur',hideTip);
document.addEventListener('visibilitychange',()=>{if(document.hidden)hideTip()});

function runSearch(query,options){
options=options||{};
searchQuery=query;
const normalized=query.trim().toLowerCase();
$('clearSearch').hidden=!query;
if(!normalized){$('searchResults').hidden=true;searchCache=[];searchIndex=-1;return}
const idQuery=normalized.replace(/^req[-_\s]?/,'');
const asId=/^\d+$/.test(idQuery)?Number(idQuery):null;
searchCache=requirements.filter(requirement=>{
if(asId!==null&&requirement.id===asId)return true;
if(reqCode(requirement).toLowerCase().includes(normalized))return true;
const project=projects.find(p=>p.id===requirement.project);
return [requirement.title,requirement.summary,requirement.assignee,requirement.status,project?project.name:''].join(' ').toLowerCase().includes(normalized);
}).sort((a,b)=>toMs(b.updatedAt)-toMs(a.updatedAt));
if(!options.keepIndex)searchIndex=searchCache.length?0:-1;
if(searchIndex>=searchCache.length)searchIndex=searchCache.length-1;
renderSearchResults();
}
function renderSearchResults(){
if(!searchQuery.trim())return;
$('searchResults').hidden=false;
$('searchResults').innerHTML=`<div class="resultshead" role="status">找到 ${searchCache.length} 条相关需求</div>`+(searchCache.length?searchCache.map((requirement,index)=>`<button type="button" class="result" role="option" aria-selected="${index===searchIndex}" data-req="${requirement.id}"><span>${esc(requirement.title)}<small>${esc((projects.find(p=>p.id===requirement.project)||{}).name||'')} · ${esc(reqCode(requirement))}</small></span>${tag(requirement.status)}</button>`).join(''):'<div class="empty">未找到相关需求，试试关键词或 REQ 编号。</div>');
const selected=$('searchResults').querySelector('[aria-selected="true"]');
if(selected&&selected.scrollIntoView)selected.scrollIntoView({block:'nearest'});
}

$('search').oninput=event=>runSearch(event.target.value);

$('search').onkeydown=event=>{
if(event.key==='ArrowDown'){
event.preventDefault();
if(!searchCache.length)return;
searchIndex=(searchIndex+1)%searchCache.length;
renderSearchResults();
}else if(event.key==='ArrowUp'){
event.preventDefault();
if(!searchCache.length)return;
searchIndex=(searchIndex-1+searchCache.length)%searchCache.length;

}
};

let exporting=false;
$('exportBackup').onclick=async()=>{
if(exporting)return;
if(!ready||saving||uploading){showToast('请等待服务器连接或保存完成后再导出');return}
if(!confirm('导出服务器已保存的全部项目？ZIP 按“项目名称/需求名称/需求原型、需求说明”组织，包含完整原型资源和 HTML/Markdown 正文，不包含未保存的草稿。'))return;
const button=$('exportBackup');
exporting=true;
button.disabled=true;
button.textContent='正在导出…';
try{
const response=await fetch('/api/workspace/export',{cache:'no-store'});
if(!response.ok){const error=await response.json();throw new Error(error.error||'导出失败')}
const blob=await response.blob();
download(blob,`需求工作台-${fileStamp()}.zip`,'application/zip');

}catch(error){showToast('导出失败：'+error.message)}

};

$('projectRequirementRows').addEventListener('change',async event=>{
if(saving||conflicted)return;
const control=event.target.closest('[data-inline-field]');
if(!control)return;
const requirement=requirements.find(r=>r.id===Number(control.dataset.reqId));
const field=control.dataset.inlineField;
if(!requirement||!['assignee','status','module'].includes(field))return;
const value=control.value;
if(field==='status'&&!STATUS.includes(value))return;
if(requirement[field]===value)return;
const project=projects.find(p=>p.id===requirement.project);
const previous={value:requirement[field],updatedAt:requirement.updatedAt,projectUpdatedAt:project?.updatedAt};
if(field==='module'&&project)project.modules=[...new Set([...moduleNames(project),...(value?[value]:[])])];
requirement[field]=value;
requirement.updatedAt=nowISO();
bumpProject(requirement.project,requirement.updatedAt);
if(!await save()){
return;
}
listState.lastRequirementId=requirement.id;
persistList();
renderProjectPage();
renderWorkspace();
const replacement=$('projectRequirementRows').querySelector(`[data-req-id="${requirement.id}"][data-inline-field="${field}"]`);
if(replacement)replacement.focus({preventScroll:true});
else $('listSearch').focus({preventScroll:true});
showToast(field==='module'?(value?`模块已设为${value}`:'已清空模块'):field==='assignee'?(value?`已指派给${value}`:'已取消指派'):`状态已更新为${value}`);
});

});

document.addEventListener('keydown',event=>{
handleFullscreenKey(event);
if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){
event.preventDefault();
if(currentPage!=='workspace')nav('#/');
requestAnimationFrame(()=>{$('search').focus();$('search').select()});
return;
}
if(event.key==='Escape'){
if(!$('modal').hidden){closeModal();return}
$('searchResults').hidden=true;
}
if(event.key==='Tab'&&!$('modal').hidden){
const nodes=[...$('dialog').querySelectorAll('button,input,textarea,select,[tabindex="0"]')].filter(node=>!node.disabled&&!node.closest('[hidden]'));
if(!nodes.length)return;
const first=nodes[0],last=nodes[nodes.length-1];
if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
}
});

let dropdownControl=null,dropdownMenu=null;
function closeDropdown(restoreFocus=false){
const control=dropdownControl;
if(dropdownMenu)dropdownMenu.remove();
if(control){control.setAttribute('aria-expanded','false');control.removeAttribute('aria-controls')}
dropdownControl=null;dropdownMenu=null;
if(restoreFocus&&control?.isConnected)control.focus({preventScroll:true});
}
function openDropdown(control){
if(control.disabled||control.multiple||control.size>1)return;
if(dropdownControl===control){closeDropdown(true);return}
closeDropdown();
dropdownControl=control;
dropdownMenu=document.createElement('div');
dropdownMenu.className='select-menu';
dropdownMenu.id='activeSelectMenu';
dropdownMenu.setAttribute('role','listbox');
dropdownMenu.setAttribute('aria-label',control.getAttribute('aria-label')||document.querySelector(`label[for="${control.id}"]`)?.textContent||'请选择');
control.setAttribute('aria-expanded','true');
control.setAttribute('aria-controls',dropdownMenu.id);
const isProject=control.id==='projectSwitcher';
const choices=isProject?projects.map(project=>({textContent:project.name,selected:project.id===listState.projectId,projectId:project.id})):Array.from(control.options);
choices.forEach((option,index)=>{
if(option.hidden)return;
const button=document.createElement('button');
button.type='button';button.className='select-option';button.textContent=option.textContent;
button.setAttribute('role','option');button.setAttribute('aria-selected',String(option.selected));
button.disabled=option.disabled||option.parentElement?.disabled===true;
button.onclick=()=>{
if(isProject){
closeDropdown(true);
if(option.projectId!==listState.projectId)nav('#/project/'+option.projectId);
return;
}
const changed=control.selectedIndex!==index;
control.selectedIndex=index;
closeDropdown(true);
if(changed){control.dispatchEvent(new Event('input',{bubbles:true}));control.dispatchEvent(new Event('change',{bubbles:true}))}
};
dropdownMenu.append(button);
});
const isModule=control.dataset.inlineField==='module';
if(control.id==='reqAssignee'||control.dataset.inlineField==='assignee'||isModule){
const editor=document.createElement('div');
editor.className='assignee-add';
const input=document.createElement('input');
input.type='text';input.maxLength=40;input.placeholder=isModule?'输入模块名称':'输入姓名';input.setAttribute('aria-label',isModule?'新增模块名称':'手动添加指派人姓名');
const add=document.createElement('button');
add.type='button';add.textContent='添加';add.disabled=true;
input.oninput=()=>{add.disabled=!input.value.trim()};
const assign=()=>{
const name=input.value.trim();
if(!name)return;
if(!Array.from(control.options).some(option=>option.value===name))control.add(new Option(name,name));
const changed=control.value!==name;
control.value=name;
closeDropdown(true);
if(changed){control.dispatchEvent(new Event('input',{bubbles:true}));control.dispatchEvent(new Event('change',{bubbles:true}))}
};
add.onclick=assign;
input.onkeydown=event=>{if(event.key==='Enter'&&!event.isComposing){event.preventDefault();event.stopPropagation();assign()}};
editor.append(input,add);
dropdownMenu.append(editor);
}
const host=control.closest('.dialog')||document.body;
host.append(dropdownMenu);
const rect=control.getBoundingClientRect();
const width=Math.min(Math.max(rect.width,188),window.innerWidth-16);
const below=window.innerHeight-rect.bottom-12,above=rect.top-12;
const upward=below<180&&above>below;
dropdownMenu.style.width=width+'px';
dropdownMenu.style.maxHeight=Math.max(60,Math.min(300,upward?above:below))+'px';
dropdownMenu.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-width-8))+'px';
if(upward)dropdownMenu.style.bottom=(window.innerHeight-rect.top+5)+'px';
else dropdownMenu.style.top=(rect.bottom+5)+'px';
(dropdownMenu.querySelector('[aria-selected="true"]:not(:disabled)')||dropdownMenu.querySelector('button:not(:disabled)'))?.focus({preventScroll:true});
}
$('projectSwitcher').onclick=()=>openDropdown($('projectSwitcher'));
document.addEventListener('pointerdown',event=>{
const control=event.target.closest('select');
if(control&&!control.disabled&&!control.multiple&&control.size<=1){event.preventDefault();openDropdown(control);return}
if(dropdownMenu&&!dropdownMenu.contains(event.target)&&!dropdownControl?.contains(event.target))closeDropdown();
},true);
document.addEventListener('keydown',event=>{
if(dropdownMenu){
if(event.target.closest('.assignee-add')&&event.key!=='Escape')return;
const options=Array.from(dropdownMenu.querySelectorAll('.select-option:not(:disabled)'));
const index=options.indexOf(document.activeElement);
if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){
event.preventDefault();event.stopImmediatePropagation();
const next=event.key==='Home'?0:event.key==='End'?options.length-1:event.key==='ArrowDown'?(index+1)%options.length:(index-1+options.length)%options.length;
options[next]?.focus({preventScroll:true});return;
}
if(event.key==='Escape'){event.preventDefault();event.stopImmediatePropagation();closeDropdown(true);return}
if(event.key==='Tab'){closeDropdown(true);return}
if(event.key.length===1&&!event.ctrlKey&&!event.metaKey){const option=options.find((item,i)=>i>index&&item.textContent.toLowerCase().startsWith(event.key.toLowerCase()))||options.find(item=>item.textContent.toLowerCase().startsWith(event.key.toLowerCase()));if(option){event.preventDefault();option.focus({preventScroll:true})}}
return;
}
const control=event.target.closest('select,#projectSwitcher');
if(control&&['ArrowDown','ArrowUp',' ','Enter','Home','End'].includes(event.key)){event.preventDefault();event.stopImmediatePropagation();openDropdown(control)}
},true);
window.addEventListener('resize',()=>closeDropdown());
document.addEventListener('scroll',event=>{if(dropdownMenu&&!dropdownMenu.contains(event.target))closeDropdown()},true);
window.addEventListener('hashchange',()=>closeDropdown());
window.addEventListener('hashchange',route);
try{if(!location.hash)window.history.replaceState(null,'','#/')}catch{}
load();
applySplit();
function packageUrl(value){try{const url=new URL(value,location.href);return ['http:','https:'].includes(url.protocol)&&/\/api\/prototypes\/[a-f0-9]{32}\//.test(url.pathname)?url.href:'about:blank'}catch{return 'about:blank'}}
function packageManifest(content){return '资源包文件清单（不提供 ZIP 下载；请保留原文件）\n入口：'+content.entry+'\n包 ID：'+content.packageId+'\n\n'+(content.files||[]).join('\n')}
document.addEventListener('input',event=>{if(event.target.closest('#dialog form'))modalDirty=true});
document.addEventListener('change',event=>{if(event.target.closest('#dialog form'))modalDirty=true});
window.addEventListener('beforeunload',event=>{if(saving||uploading||workspaceDirty||modalDirty){event.preventDefault();event.returnValue=''}});
})();
